
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeri Klambi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f8f6ec; color:#222; }
        .hero { background:#eeeade; padding:70px 15px; }
        .form-box { background:#171717; color:white; padding:25px; border-radius:15px; }
        .btn-klambi { background:#111; color:white; }
        .btn-klambi:hover { background:#444; color:white; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand bg-light px-4">
    <a class="navbar-brand fw-bold" href="#">GALERI KLAMBI</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="#beranda">Beranda</a>
        <a class="nav-link" href="#daftar">Registrasi</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero text-center" id="beranda">
    <h1 class="fw-bold">Find Your Own Style</h1>
    <p>Temukan gaya terbaikmu bersama Galeri Klambi.</p>
    <a href="#daftar" class="btn btn-klambi">Daftar Sekarang</a>
</section>

<!-- FORM -->
<section class="container py-5" id="daftar">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-box">
                <h3 class="text-center mb-4">Registrasi Pelanggan</h3>

                <form id="formDaftar">
                    <input type="text" id="nama" class="form-control mb-3"
                        placeholder="Nama Lengkap" required>

                    <input type="email" id="email" class="form-control mb-3"
                        placeholder="Email" required>

                    <input type="password" id="password" class="form-control mb-3"
                        placeholder="Password (minimal 6 karakter)" required>

                    <input type="password" id="konfirmasi" class="form-control mb-3"
                        placeholder="Konfirmasi Password" required>

                    <button class="btn btn-klambi w-100">Daftar</button>
                </form>

                <p id="pesan" class="text-center mt-3"></p>
            </div>
        </div>
    </div>
</section>

<footer class="text-center text-white p-3" style="background:#171717">
    &copy; 2026 Galeri Klambi
</footer>

<script>
document.getElementById("formDaftar").addEventListener("submit", function(e) {
    e.preventDefault();

    let nama = document.getElementById("nama").value.trim();
    let pass = document.getElementById("password").value;
    let ulang = document.getElementById("konfirmasi").value;
    let pesan = document.getElementById("pesan");

    if (nama === "") {
        pesan.innerHTML = "Nama wajib diisi!";
        pesan.style.color = "red";
    } else if (pass.length < 6) {
        pesan.innerHTML = "Password minimal 6 karakter!";
        pesan.style.color = "red";
    } else if (pass !== ulang) {
        pesan.innerHTML = "Password tidak cocok!";
        pesan.style.color = "red";
    } else {
        pesan.innerHTML = "Registrasi berhasil!";
        pesan.style.color = "lightgreen";
        this.reset();
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
